let route='Website',kind='Photo',month='2026-10',day='2026-10-10',selected=null,nominee=null;
const view=document.getElementById('view'),nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(r){route=r;selected=null;render();window.scrollTo(0,0)}
function cards(list){return list.length?`<div class="grid">${list.map(m=>`<button class="card" onclick="openMoment(${m.id})"><div class="art">${m.kind==='Photo'?`<img src="${illustration}" alt="Illustrative sample photo">`:`<span class="mark">${m.kind==='Audio'?'▂ ▅ ▃ ▇ ▄ ▂ ▆ ▃':'▷'}</span>`}</div><div class="copy"><small>${m.day} · ${m.kind}${m.star?' · ★ Only you':''}</small><h3>${esc(m.title)}</h3><p>${esc(m.caption)}</p></div></button>`).join('')}</div>`:`<div class="note"><h3>A day waiting for a memory.</h3><p>Nothing here yet.</p><button onclick="go('Capture')">Add a moment</button></div>`}
function openMoment(id){selected=id;render()}
function detail(){const m=moments.find(m=>m.id===selected);return m?`<section class="detail"><button onclick="selected=null;render()">Close</button><h2>${esc(m.title)}</h2><small>${m.day} · ${m.kind}</small>${m.kind==='Photo'?`<img src="${illustration}" alt="Illustrative sample keepsake">`:`<div class="well"><span class="mark">${m.kind==='Audio'?'▂ ▅ ▃ ▇ ▄ ▂ ▆ ▃':'▷'}</span><p>Sample ${m.kind.toLowerCase()} player. No playback.</p></div>`}<p>${esc(m.caption)}</p><button onclick="toggle(${m.id})">${m.star?'★ Starred · only you':'☆ Star this moment'}</button><p>Private by default. No nominee access.</p></section>`:''}
function toggle(id){const m=moments.find(m=>m.id===id);m.star=!m.star;render()}
function save(e){e.preventDefault();const f=new FormData(e.target);moments.unshift({id:Date.now(),title:f.get('title')||'A little piece of today',day:f.get('date'),kind,caption:(f.get('caption')||'A sample moment.')+(f.get('audio')?' · Sample audio caption attached.':''),star:!!f.get('star')});day=f.get('date');month=day.slice(0,7);go('Calendar')}
function render(){nav.innerHTML=['Website','Journal','Capture','Calendar','Nominee','Screens','Product brief'].map(r=>`<button class="${route===r?'active':''}" onclick="go('${r}')">${r}</button>`).join('');
if(route==='Website')view.innerHTML=`<div class="hero"><div><small>DIGI MEMOIR / DESIGN CONCEPT</small><h1>A life worth returning to.</h1><p>Keep the days that might otherwise slip away.</p><p>A photograph. Your voice. A minute of your life.<br>Not for an audience. For the person you will become.</p><button onclick="go('Journal')">Explore the sample journal</button></div><div><img src="${illustration}" alt="Illustrative keepsake"><small>Illustrative concept artwork</small></div></div><section><h2>What happened 34 days ago, at 1 pm?</h2><p>Some moments come back easily. Others need a small reminder. A laugh after class. Rain outside the window. Someone's voice.</p><p>Your ordinary days are worth keeping too.</p></section><div class="note"><h2>Keep the moment.<br>Return to the feeling.</h2><p>Years later, a date can bring you back to the people, places and small details of a life you lived.</p></div><section><h2>Keep it your way</h2><p>Photo, video or voice. Photos may carry text and audio captions.</p><button onclick="go('Capture')">Try sample capture</button><h2>Find your way back</h2><p>Choose a date. Return to its memories. Capture time and timezone are planned for production.</p><button onclick="go('Calendar')">Open the calendar</button><h2>Only yours</h2><p>All memories owner-only now. Optional sharing later. Nominee handover includes all data, including stars, once activation rules are agreed.</p><h2>For every chapter</h2><p>All ages. India first. Keep ordinary life and return in adulthood, later life, or a quiet hospital stay. A hope of comfort, not a medical promise.</p></section><div class="note">Design review, not a live service. Native apps require real capture, storage, authentication and security implementation.</div>`;
if(route==='Screens')view.innerHTML=`<h1>One quiet experience.</h1><p>Website and mobile web design, not released native apps.</p>${['Journal','Capture','Calendar','Nominee'].map(r=>`<section><h2>${r}</h2><img style="max-width:360px;width:100%;display:block;margin-bottom:16px;border:1px solid var(--line)" src="${screenImages[r.toLowerCase()]}" alt="${r} sample mobile screen"><button onclick="go('${r}')">Open interactive ${r.toLowerCase()} screen</button></section>`).join('')}<div class="note">Ready for design review. Android/iOS binaries, OAuth, Drive uploads, recovery, export/deletion and child-data consent still require implementation and testing.</div>`;
if(route==='Journal')view.innerHTML=`<div class="hero"><div><small>DIGI MEMOIR / WORKING NAME</small><h1>Some days deserve<br>to stay with you.</h1><p>A photograph. Your voice. A minute of your life.<br>Keep it for the person you are becoming.</p><button class="primary" onclick="go('Capture')">＋ Add a moment</button><p><small>No sign-in needed for this design review.</small></p></div><div><img src="${illustration}" alt="Illustrative keepsake and calendar"><small>Illustrative concept artwork</small></div></div><section><h2>Your sample journal</h2>${cards(moments.slice(0,3))}${detail()}</section><div class="note">Your journal belongs to you. Proposed: Google sign-in plus separate narrow Drive consent. Nothing connects in this prototype.</div>`;
if(route==='Capture')view.innerHTML=`<h1>Keep a little of today</h1><p>There is no right way to remember.</p>${['Photo','Video','Audio'].map(k=>`<button class="${kind===k?'active':''}" onclick="kind='${k}';render()">${k}</button>`).join(' ')}<div class="well">${kind==='Photo'?`<img src="${illustration}" alt="Illustrative sample photo">`:`<span class="mark">${kind==='Audio'?'▂ ▅ ▃ ▇ ▄ ▂ ▆ ▃':'▷'}</span>`}<p>Sample ${kind.toLowerCase()} only. No recording or file access.</p></div><form onsubmit="save(event)"><label>Give it a name<input name="title" maxlength="120" placeholder="A little piece of today"></label><label>Date<input name="date" type="date" required value="${day}"></label><label>A few words, if you like<textarea name="caption" rows="3"></textarea></label>${kind==='Photo'?'<label class="check"><input type="checkbox" name="audio"> Add a sample audio caption</label>':''}<label class="check"><input name="star" type="checkbox"> ★ Star as a key moment. Only you.</label><p>All moments start private. All data, including stars, is included in approved nominee handover.</p><button class="primary">Save sample moment</button></form>`;
if(route==='Calendar'){const [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),o=(new Date(y,m-1,1).getDay()+6)%7;view.innerHTML=`<h1>A life, one day at a time</h1><label>Choose a month<input type="month" value="${month}" onchange="month=this.value;day=month+'-01';selected=null;render()"></label><div class="calendar"><div class="days">${['M','T','W','T','F','S','S'].map(d=>`<small>${d}</small>`).join('')}${'<span></span>'.repeat(o)}${Array.from({length:n},(_,i)=>{const d=month+'-'+String(i+1).padStart(2,'0');return `<button aria-label="${d}" class="${d===day?'active':''}" onclick="day='${d}';selected=null;render()">${i+1}<span class="dot">${moments.some(a=>a.day===d)?'•':'&nbsp;'}</span></button>`}).join('')}</div></div><small>• A memory lives here. Tap a day.</small><h2>${day}</h2><button onclick="month='2016-10';day='2016-10-10';selected=null;render()">Jump back ten years</button><section>${cards(moments.filter(m=>m.day===day))}${detail()}</section>`}
if(route==='Nominee')view.innerHTML=`<h1>Someone you trust</h1><p>A name for the future. Not a door into your journal.</p><div class="note">No access granted. Adding a nominee shares nothing. All memories are owner-only now. Nominee handover includes all data, including stars; activation rules need review.</div><form onsubmit="event.preventDefault();nominee={name:this.elements.name.value,email:this.elements.email.value};render()"><label>Their name<input name="name" required></label><label>Their email<input name="email" type="email" required></label><button class="primary">Save sample nominee</button></form>${nominee?`<div class="note">Sample nominee saved: ${esc(nominee.name)} · ${esc(nominee.email)}<p>No invitation sent. No access granted.</p><button onclick="nominee=null;render()">Remove sample nominee</button></div>`:''}`;
if(route==='Product brief')view.innerHTML=`<h1>Quiet by design.<br>Private by default.</h1><p>Design review first. No production app shipped.</p><section><h2>The smallest useful product</h2><ol><li>Capture photo, video or audio; photo may have text/audio captions.</li><li>Calendar → day → all memories → detail.</li><li>Star key moments, included in an approved all-data nominee handover.</li><li>Add a nominee contact without silent sharing.</li></ol></section><section><h2>Storage recommendation</h2><p>Proposed user-owned Google Drive with drive.file scope, versioned manifest and local encrypted index. Sign-in and Drive consent are separate.</p><div class="note">User quota applies. School accounts can require admin approval or disappear after graduation. Current standard API use has no additional cost; later-2026 quota billing changes are planned. No lifetime or zero-total-cost promise.</div></section><section><h2>Before building</h2><ol><li>All memories are owner-only now. Optional sharing comes later.</li><li>Nominee scope is all data including stars. Agree activation and verification.</li><li>All ages; India first, with other countries later.</li><li>User-owned Google Drive is the initial store.</li></ol><p>Review child-data consent, export/migration, encryption/key recovery, iOS login policy and denied/offline/quota states.</p><p>Full product spec, UX flows and source links are in the repository.</p></section>`;
